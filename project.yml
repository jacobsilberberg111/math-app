# XcodeGen spec for building the same sources as a regular Xcode project (used by CI to
# produce a simulator build and an unsigned .ipa). The primary format is TutorNotes.swiftpm.
#   brew install xcodegen && xcodegen generate && open TutorNotes.xcodeproj
name: TutorNotes
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
targets:
  TutorNotes:
    type: application
    platform: iOS
    sources:
      - path: TutorNotes.swiftpm
        excludes:
          - Package.swift
    settings:
      base:
        PRODUCT_NAME: Tutor Notes
        PRODUCT_BUNDLE_IDENTIFIER: com.example.tutornotes
        TARGETED_DEVICE_FAMILY: "2"
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Tutor Notes
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.education
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Record lectures alongside your notes and ask your tutor questions by voice.
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: Turn what you say into questions for your tutor.
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: Insert photos into your notes or share them with your tutor.
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
