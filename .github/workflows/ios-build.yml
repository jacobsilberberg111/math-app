name: iOS Build

on:
  workflow_dispatch:

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  xcode-project:
    name: Build app, sideloadable .ipa, demo video
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version
          xcrun simctl list devices available | grep -i ipad | head -20 || true

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build for iPad simulator
        run: |
          set -o pipefail
          xcodebuild -project TutorNotes.xcodeproj -scheme TutorNotes -configuration Debug \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build/sim \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee sim-build.log | grep -E "error:|warning:|BUILD" | sort -u | head -200 || true
          grep -q "BUILD SUCCEEDED" sim-build.log
          echo "Swift files compiled: $(grep -c 'SwiftCompile normal' sim-build.log || true)"

      - name: Compiler errors summary
        if: failure()
        run: |
          echo "==== ERRORS ===="
          grep -E "error:" sim-build.log | sort -u | head -150 || true

      - name: Build Release for device (unsigned)
        run: |
          set -o pipefail
          xcodebuild -project TutorNotes.xcodeproj -scheme TutorNotes -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build/device \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build 2>&1 | tee device-build.log | grep -E "error:|BUILD" || true
          grep -q "BUILD SUCCEEDED" device-build.log

      - name: Package unsigned .ipa
        run: |
          APP=$(find build/device/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry Margin.ipa Payload
          ls -la Margin.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Margin-ipa
          path: Margin.ipa
          retention-days: 30

      - name: Boot iPad simulator
        run: |
          DEVICE=$(xcrun simctl list devices available | grep -E "iPad Pro 13-inch" | head -1 | grep -oE "[0-9A-F]{8}-([0-9A-F]{4}-){3}[0-9A-F]{12}")
          if [ -z "$DEVICE" ]; then DEVICE=$(xcrun simctl list devices available | grep -E "iPad" | head -1 | grep -oE "[0-9A-F]{8}-([0-9A-F]{4}-){3}[0-9A-F]{12}"); fi
          echo "DEVICE=$DEVICE" >> "$GITHUB_ENV"
          xcrun simctl list devices | grep "$DEVICE"
          xcrun simctl boot "$DEVICE" || true
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl status_bar "$DEVICE" override --time 9:41 --batteryState charged --batteryLevel 100 --wifiBars 3 || true
          APP=$(find build/sim/Build/Products/Debug-iphonesimulator -maxdepth 1 -name "*.app" | head -1)
          xcrun simctl install "$DEVICE" "$APP"

      - name: Feature check
        run: |
          # Drives the lasso, ink conversion, find, page, export and colour features on a fresh
          # note in the simulator and fails the job if any check fails or the app doesn't finish.
          mkdir -p feature-check
          xcrun simctl launch --console-pty "$DEVICE" com.jacobsilberberg.margin -feature-check > feature-check/app-log.txt 2>&1 &
          for i in $(seq 1 240); do
            if grep -q "FEATURE_CHECK_DONE" feature-check/app-log.txt 2>/dev/null; then echo "finished after ${i}s"; break; fi
            sleep 1
          done
          xcrun simctl io "$DEVICE" screenshot feature-check/final.png || true
          xcrun simctl terminate "$DEVICE" com.jacobsilberberg.margin || true
          grep "CHECK" feature-check/app-log.txt || tail -60 feature-check/app-log.txt
          grep -q "FEATURE_CHECK_DONE failures=0" feature-check/app-log.txt

      - name: Screenshots
        continue-on-error: true
        run: |
          mkdir -p screenshots
          xcrun simctl launch "$DEVICE" com.jacobsilberberg.margin -uitest-skip-onboarding
          sleep 6
          xcrun simctl io "$DEVICE" screenshot screenshots/1-library.png
          xcrun simctl terminate "$DEVICE" com.jacobsilberberg.margin || true
          xcrun simctl launch "$DEVICE" com.jacobsilberberg.margin -uitest-skip-onboarding -uitest-open-first-note
          sleep 14
          xcrun simctl io "$DEVICE" screenshot screenshots/2-editor.png
          xcrun simctl terminate "$DEVICE" com.jacobsilberberg.margin || true
          xcrun simctl launch "$DEVICE" com.jacobsilberberg.margin -uitest-skip-onboarding -uitest-open-first-note -uitest-show-tutor
          sleep 14
          xcrun simctl io "$DEVICE" screenshot screenshots/3-editor-tutor.png
          xcrun simctl terminate "$DEVICE" com.jacobsilberberg.margin || true

      - name: Record demo video
        continue-on-error: true
        run: |
          mkdir -p video
          # Fresh data so the demo starts from the welcome note.
          xcrun simctl uninstall "$DEVICE" com.jacobsilberberg.margin || true
          APP=$(find build/sim/Build/Products/Debug-iphonesimulator -maxdepth 1 -name "*.app" | head -1)
          xcrun simctl install "$DEVICE" "$APP"
          xcrun simctl spawn "$DEVICE" log stream --style compact --level debug --predicate 'process == "Margin"' > video/os-log.txt 2>&1 &
          LOGP=$!
          xcrun simctl io "$DEVICE" recordVideo --codec=h264 --force video/demo.mp4 &
          REC=$!
          sleep 3
          xcrun simctl launch --console-pty "$DEVICE" com.jacobsilberberg.margin -demo-script > video/app-log.txt 2>&1 &
          for i in $(seq 1 300); do
            if grep -q "DEMO_COMPLETE" video/app-log.txt 2>/dev/null; then echo "demo finished after ${i}s"; break; fi
            sleep 1
          done
          sleep 2
          kill -INT $REC || true
          wait $REC || true
          kill $LOGP || true
          echo "==== SwiftUI / layout warnings ===="
          grep -iE "AttributeGraph|cycle detected|Modifying state|Publishing changes|undefined behavior|SwiftUI" video/os-log.txt | sed -E 's/^[0-9: .-]+//' | sort | uniq -c | sort -rn | head -40 || true
          xcrun simctl io "$DEVICE" screenshot video/final-frame.png || true
          ls -la video
          grep "DEMO:" video/app-log.txt || true
          tail -40 video/app-log.txt || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: feature-check
          path: feature-check
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: screenshots
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: demo-video
          path: video
          retention-days: 14

  playgrounds-package:
    name: Build Swift Playgrounds package
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Build TutorNotes.swiftpm for iPad simulator
        working-directory: TutorNotes.swiftpm
        run: |
          set -o pipefail
          xcodebuild -version
          xcodebuild -scheme "Margin" -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee ../pkg-build.log | grep -E "error:|warning:|BUILD" | sort -u | head -200 || true
          grep -q "BUILD SUCCEEDED" ../pkg-build.log
          echo "Swift files compiled: $(grep -c 'SwiftCompile normal' ../pkg-build.log || true)"
      - name: Errors summary
        if: failure()
        run: grep -E "error:" pkg-build.log | sort -u | head -100 || true

  core-tests:
    name: Core unit tests
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: bash CoreTests/run.sh

  server:
    name: Railway server tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
        working-directory: server
